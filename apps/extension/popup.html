<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VeriBridge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 340px;
      padding: 16px;
      background: #fff;
      color: #111;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 30px;
      height: 30px;
      background: #111;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      flex-shrink: 0;
      letter-spacing: -1px;
    }
    .brand { font-weight: 700; font-size: 15px; }
    .brand-sub { font-size: 11px; color: #666; margin-top: 1px; }

    /* Fields */
    .field { display: grid; gap: 4px; margin-bottom: 10px; }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #111;
      background: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color 0.12s;
    }
    input:focus, textarea:focus { border-color: #111; }
    textarea { resize: vertical; min-height: 58px; }

    /* Advanced collapsible */
    details { margin-bottom: 10px; }
    details summary {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    details summary::before { content: "▸"; font-size: 10px; }
    details[open] summary::before { content: "▾"; }
    details[open] .advanced-body { display: grid; gap: 0; margin-top: 8px; }
    .advanced-body { display: none; }

    /* Divider */
    .divider { height: 1px; background: #f0f0f0; margin: 12px 0; }

    /* Status */
    .status-box {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 9px 11px;
      background: #f9fafb;
      margin-bottom: 10px;
    }
    .status-row { display: flex; align-items: center; gap: 7px; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #9ca3af;
    }
    .status-dot.recording {
      background: #16a34a;
      animation: pulse 1.1s ease-in-out infinite;
    }
    .status-dot.stopped { background: #f59e0b; }
    .status-dot.uploaded { background: #3b82f6; }
    .status-dot.error { background: #dc2626; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .status-text { font-size: 12px; color: #374151; flex: 1; }
    .event-count { font-size: 11px; color: #9ca3af; margin-top: 3px; }

    /* Buttons */
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .actions.single { grid-template-columns: 1fr; }
    button {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      transition: opacity 0.1s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-stop  { background: #dc2626; color: #fff; }
    .btn-send  { background: #111; color: #fff; }

    /* Privacy notice */
    .privacy {
      border: 1px solid #dcfce7;
      border-radius: 8px;
      padding: 8px 10px;
      background: #f0fdf4;
      font-size: 11px;
      color: #166534;
      line-height: 1.55;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">VB</div>
    <div>
      <div class="brand">VeriBridge</div>
      <div class="brand-sub">Extension Proof Recorder</div>
    </div>
  </div>

  <div class="field">
    <label for="sessionId">Session ID</label>
    <input id="sessionId" type="text" placeholder="Paste session ID from dashboard" />
  </div>

  <details>
    <summary>Advanced</summary>
    <div class="advanced-body">
      <div class="field">
        <label for="apiUrl">Backend API URL</label>
        <input id="apiUrl" type="text" placeholder="http://localhost:8000" />
      </div>
      <div class="field">
        <label for="authToken">Auth Token</label>
        <input id="authToken" type="password" placeholder="Bearer token (required for auth-gated API)" />
      </div>
    </div>
  </details>

  <div class="divider"></div>

  <div class="status-box">
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready</span>
    </div>
    <div class="event-count" id="eventCount"></div>
  </div>

  <div class="actions">
    <button class="btn-start" id="btnStart">▶ Start Recording</button>
    <button class="btn-stop"  id="btnStop"  disabled>■ Stop Recording</button>
  </div>

  <div class="field">
    <label for="finalNote">Final note (optional)</label>
    <textarea id="finalNote" placeholder="Describe what you demonstrated in this session…"></textarea>
  </div>

  <div class="actions single" style="margin-bottom: 12px;">
    <button class="btn-send" id="btnSend" disabled>↑ Send Proof</button>
  </div>

  <div class="privacy">
    VeriBridge records project workflow evidence only. Passwords and sensitive fields are masked.
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
